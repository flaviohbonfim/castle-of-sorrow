<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0810" />
    <meta name="description" content="Castle of Sorrow — a SotN-inspired metroidvania" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Castle of Sorrow</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0810;
        height: 100%;
        overflow: hidden;
      }
      #game-root {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script>
      window.__errs = [];
      window.addEventListener("error", (e) => {
        window.__errs.push(String(e.error && e.error.stack ? e.error.stack : e.message));
      });
      window.addEventListener("unhandledrejection", (e) => {
        window.__errs.push("rejection: " + String(e.reason));
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
